<div class="app" [class.is-open]="sidebarOpen()">
  <aside class="app-nav">
    <div class="app-nav-brand">
      <a routerLink="/inicio" (click)="sidebarOpen.set(false)"
        ><app-brand [inverse]="true" [small]="true"
      /></a>
    </div>
    <nav class="app-nav-scroll">
      <a
        class="app-nav-link"
        routerLink="/inicio"
        routerLinkActive="is-on"
        (click)="sidebarOpen.set(false)"
      >
        <i class="bi bi-house-door"></i>Inicio
      </a>
      @for (group of groups(); track group.processor) {
        <div class="app-nav-group">{{ group.label }}</div>
        @for (module of group.modules; track module.path) {
          <a
            class="app-nav-link"
            [routerLink]="['/', module.path]"
            routerLinkActive="is-on"
            (click)="sidebarOpen.set(false)"
          >
            <i class="bi" [class]="module.icon"></i>
            <span class="flex-grow-1">{{ module.label }}</span>
            @if (!isReady(module)) {
              <span class="app-nav-draft" title="Borrador: todavía no está construido">•</span>
            }
          </a>
        }
      }
    </nav>
    <div class="app-nav-foot">Base borrador · UcoPet</div>
  </aside>
  <div class="app-backdrop" (click)="sidebarOpen.set(false)"></div>

  <div class="app-main">
    <header class="app-bar">
      <button
        type="button"
        class="btn btn-light btn-sm d-lg-none"
        aria-label="Abrir menú"
        (click)="sidebarOpen.set(true)"
      >
        <i class="bi bi-list"></i>
      </button>
      <app-headquarter-menu />
      <span class="app-crumb d-none d-md-inline"
        ><b>{{ section() }}</b> · {{ today }}</span
      >
      <span class="flex-grow-1"></span>
      <div ngbDropdown placement="bottom-end">
        <button type="button" class="user-chip" ngbDropdownToggle>
          <span class="user-avatar">{{ initials() }}</span>
          <span class="user-text d-none d-sm-flex">
            <b>{{ session.profile()?.fullName }}</b>
            <small>{{ session.isAdmin() ? 'Administrador' : 'Médico' }}</small>
          </span>
        </button>
        <div ngbDropdownMenu class="shadow">
          <div class="dropdown-header">
            {{ session.isAdmin() ? 'Administrador de la clínica' : 'Médico' }}
          </div>
          <div class="dropdown-divider"></div>
          <button type="button" ngbDropdownItem class="text-danger" (click)="logout()">
            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
          </button>
        </div>
      </div>
    </header>
    <main class="app-body">
      <router-outlet />
    </main>
  </div>
</div>
<app-toast-host />
