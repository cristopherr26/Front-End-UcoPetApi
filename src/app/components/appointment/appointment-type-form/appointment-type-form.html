<form [formGroup]="form" (ngSubmit)="save()" novalidate>
  <app-modal-frame
    [title]="typeId() ? 'Editar tipo de cita' : 'Nuevo tipo de cita'"
    subtitle="Los campos con * son obligatorios"
    icon="bi-tags"
    tone="grad"
    (closed)="modal.dismiss()"
  >
    @if (error()) {
      <div class="alert alert-danger d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-triangle-fill"></i>{{ error() }}
      </div>
    }
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label" for="type-name">Nombre *</label>
        <input
          id="type-name"
          class="form-control"
          formControlName="name"
          maxlength="100"
          placeholder="Ej.: Consulta general"
          [class.is-invalid]="invalid('name')"
        />
        <div class="invalid-feedback">El nombre es obligatorio (hasta 100 caracteres)</div>
      </div>
      <div class="col-12">
        <label class="form-label" for="type-description">Descripción *</label>
        <textarea
          id="type-description"
          class="form-control"
          rows="3"
          maxlength="255"
          formControlName="description"
          [class.is-invalid]="invalid('description')"
        ></textarea>
        <div class="invalid-feedback">La descripción es obligatoria (hasta 255 caracteres)</div>
      </div>
      <div class="col-12">
        <div class="form-check form-switch">
          <input
            id="type-active"
            class="form-check-input"
            type="checkbox"
            role="switch"
            formControlName="isActive"
          />
          <label class="form-check-label" for="type-active">
            Activo (solo los tipos activos se pueden elegir al agendar)
          </label>
        </div>
      </div>
    </div>
    <ng-container modalFooter>
      <button type="button" class="btn btn-light" (click)="modal.dismiss()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        @if (saving()) {
          <span class="spinner-border spinner-border-sm me-2"></span>Guardando...
        } @else {
          <i class="bi bi-check2 me-1"></i>Guardar
        }
      </button>
    </ng-container>
  </app-modal-frame>
</form>
