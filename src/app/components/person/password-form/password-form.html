<form class="d-flex flex-column overflow-hidden" [formGroup]="form" (ngSubmit)="save()" novalidate>
  <app-modal-frame
    title="Asignar contraseña"
    [subtitle]="name()"
    icon="bi-key"
    tone="warn"
    (closed)="modal.dismiss()"
  >
    @if (error()) {
      <div class="alert alert-danger d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-triangle-fill"></i>{{ error() }}
      </div>
    }
    <p class="small text-body-secondary">
      Se cierran las sesiones que tenga abiertas y se desbloquea la cuenta si estaba bloqueada.
      Entrégale la contraseña en persona y pídele que la cambie desde "Mi cuenta".
    </p>

    <div class="mb-3">
      <label class="form-label" for="new-password">Contraseña nueva *</label>
      <div class="input-group has-validation">
        <input
          id="new-password"
          class="form-control"
          formControlName="password"
          maxlength="72"
          autocomplete="new-password"
          [type]="show() ? 'text' : 'password'"
          [class.is-invalid]="passwordInvalid()"
        />
        <button
          type="button"
          class="btn btn-light"
          (click)="show.set(!show())"
          [attr.aria-label]="show() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          <i class="bi" [class.bi-eye]="!show()" [class.bi-eye-slash]="show()"></i>
        </button>
        <div class="invalid-feedback">Entre 8 y 72 caracteres</div>
      </div>
    </div>
    <div>
      <label class="form-label" for="confirm-password">Repite la contraseña *</label>
      <input
        id="confirm-password"
        class="form-control"
        formControlName="confirm"
        maxlength="72"
        autocomplete="new-password"
        [type]="show() ? 'text' : 'password'"
        [class.is-invalid]="confirmInvalid()"
      />
      <div class="invalid-feedback">Las dos contraseñas no coinciden</div>
    </div>

    <ng-container modalFooter>
      <button type="button" class="btn btn-light" (click)="modal.dismiss()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        @if (saving()) {
          <span class="spinner-border spinner-border-sm me-2"></span>Guardando...
        } @else {
          <i class="bi bi-check2 me-1"></i>Asignar
        }
      </button>
    </ng-container>
  </app-modal-frame>
</form>
