<form [formGroup]="form" (ngSubmit)="save()" novalidate>
  <app-modal-frame
    [title]="relationId() ? 'Editar especialidad del médico' : 'Asignar especialidad'"
    subtitle="Los campos con * son obligatorios"
    icon="bi-award"
    tone="teal"
    (closed)="modal.dismiss()"
  >
    @if (loading()) {
      <div class="text-center py-5"><span class="spinner-border text-primary"></span></div>
    } @else {
      @if (error()) {
        <div class="alert alert-danger d-flex align-items-center gap-2">
          <i class="bi bi-exclamation-triangle-fill"></i>{{ error() }}
        </div>
      }
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label" for="relation-doctor">Médico *</label>
          <select
            id="relation-doctor"
            class="form-select"
            formControlName="doctor"
            [class.is-invalid]="invalid('doctor')"
          >
            <option value="" disabled>Elige un médico</option>
            @for (option of doctorOptions(); track option.id) {
              <option [value]="option.id">{{ option.label }}</option>
            }
          </select>
          <div class="invalid-feedback">El médico es obligatorio</div>
        </div>
        <div class="col-12">
          <label class="form-label" for="relation-specialtie">Especialidad *</label>
          @if (canPickSpecialtie()) {
            <select
              id="relation-specialtie"
              class="form-select"
              formControlName="specialtie"
              [class.is-invalid]="invalid('specialtie')"
            >
              <option value="" disabled>Elige una especialidad</option>
              @for (option of specialtieOptions(); track option.id) {
                <option [value]="option.id">{{ option.label }}</option>
              }
            </select>
          } @else {
            <input
              id="relation-specialtie"
              class="form-control"
              formControlName="specialtie"
              placeholder="UUID de la especialidad"
              [class.is-invalid]="invalid('specialtie')"
            />
            <div class="form-text">
              Todavía no hay lista de especialidades: pega el id de una especialidad existente.
            </div>
          }
          <div class="invalid-feedback">Elige una especialidad o pega un UUID válido</div>
        </div>
      </div>
    }
    <ng-container modalFooter>
      <button type="button" class="btn btn-light" (click)="modal.dismiss()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="saving() || loading()">
        @if (saving()) {
          <span class="spinner-border spinner-border-sm me-2"></span>Guardando...
        } @else {
          <i class="bi bi-check2 me-1"></i>Guardar
        }
      </button>
    </ng-container>
  </app-modal-frame>
</form>
